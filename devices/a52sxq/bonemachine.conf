# Common kernel settings
KERNEL_REPO="https://github.com/bone-machine/android_kernel_samsung_sm7325_a52s_5g.git"
# resukisu-aosp carries the Android 17 BPF/XDP backport we need. The ReSukiSU
# integration on top of it is removed again by the device patch script.
KERNEL_BRANCH="resukisu-aosp"
KERNEL_DIR="android_kernel_samsung_sm7325_a52s_5g"
IS_DEPTH_CLONE="true"

# Kernel's config settings
MAIN_DEFCONFIG="vendor/a52sxq_kor_single_defconfig"
COMMON_DEFCONFIG=""
DEVICE_DEFCONFIG=""
FEATURE_DEFCONFIG=""
IS_SYNCCONFIG="true"
IS_SPOOF_DEFCONFIG="true"

# Maintainer info
KBUILD_BUILD_USER="riarumoda"
KBUILD_BUILD_HOST="flexgroups"

# Goodies settings
KERNELSU="true"
BBG="true"
NOMOUNT="true"
DROIDSPACES="false"

# UNICA flasher settings
UNICA_CODENAME="a52sxq"
# The kernel builds its own dtbo.img (CONFIG_BUILD_ARM64_DT_OVERLAY=y),
# so package it directly instead of running mkdtboimg on the .dtbo files.
UNICA_DTBO_IMAGE="out/arch/arm64/boot/dtbo.img"
# Use bone-machine's prebuilt AOSP boot image as the repack base.
UNICA_BOOT_URL="https://raw.githubusercontent.com/bone-machine/android_kernel_samsung_sm7325_a52s_5g/aosp/toolchain/baseimages/aosp/boot.img"

# Packaging settings
IS_ANYKERNEL3="false"
ZIP_PREFIX="neon-bonemachine-a52sxq-sm7325"
