# Common kernel settings
KERNEL_REPO="https://github.com/LineageOS/android_kernel_samsung_sm7325.git"
KERNEL_BRANCH="lineage-24.0"
KERNEL_DIR="android_kernel_samsung_sm7325"
IS_DEPTH_CLONE="true"

# Kernel's config settings
MAIN_DEFCONFIG="gki_defconfig"
COMMON_DEFCONFIG="vendor/lahaina_GKI.config vendor/lahaina_QGKI.config"
DEVICE_DEFCONFIG="vendor/lineage-a52sxq_defconfig"
FEATURE_DEFCONFIG=""
IS_SYNCCONFIG="true"
IS_SPOOF_DEFCONFIG="true"

# Maintainer info
KBUILD_BUILD_USER="isaiahscape"
KBUILD_BUILD_HOST="flexgroups"

# Goodies settings
KERNELSU="true"
BBG="true"
NOMOUNT="true"
DROIDSPACES="false"

# UNICA flasher settings
UNICA_CODENAME="a52sxq"
UNICA_DTBO_DIR="arch/arm64/boot/dts/samsung/a52/a52sxq"

# Packaging settings
IS_ANYKERNEL3="false"
ZIP_PREFIX="neon-lineage-a52sxq-sm7325"
