# Common kernel settings
KERNEL_REPO="https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git"
KERNEL_BRANCH="lineage-24.0"
KERNEL_DIR="android_kernel_xiaomi_sm6150"
IS_DEPTH_CLONE="true"

# Kernel's config settings
MAIN_DEFCONFIG="vendor/sdmsteppe-perf_defconfig"
COMMON_DEFCONFIG=""
DEVICE_DEFCONFIG="vendor/violet.config"
FEATURE_DEFCONFIG=""
IS_SYNCCONFIG="false"
IS_SPOOF_DEFCONFIG="true"

# Maintainer info
KBUILD_BUILD_USER="riarumoda"
KBUILD_BUILD_HOST="flexgroups"

# Goodies settings
KERNELSU="true"
BBG="true"
NOMOUNT="true"
DROIDSPACES="true"

# AnyKernel3 settings
IMAGE="Image.gz"
DTB="dtb.img"
DTBO="dtbo.img"
VERSIONS="13-17"
BANNER="violet (SM6150)"
DEVICE_1="violet"
DEVICE_2="violetin"
ZIP_PREFIX="neon-lineage-violet-sm6150"
IS_EXTENSIVE_DEVICE="false"
IS_ANYKERNEL3="true"
