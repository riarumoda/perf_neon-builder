# Common kernel settings
KERNEL_REPO="https://github.com/riarumoda/android_kernel_xiaomi_sm6150.git"
KERNEL_BRANCH="lineage-24.0"
KERNEL_DIR="android_kernel_xiaomi_sm6150"
IS_DEPTH_CLONE="true"

# Kernel's config settings
MAIN_DEFCONFIG="vendor/sdmsteppe-perf_defconfig"
COMMON_DEFCONFIG=""
DEVICE_DEFCONFIG="vendor/sweet.config"
FEATURE_DEFCONFIG=""
IS_SYNCCONFIG="false"
IS_SPOOF_DEFCONFIG="false"

# Maintainer info
KBUILD_BUILD_USER="riarumoda"
KBUILD_BUILD_HOST="flexgroups"

# Goodies settings
KERNELSU="true"
BBG="true"
NOMOUNT="true"
DROIDSPACES="true"

# AnyKernel3 settings
IMAGE="Image.gz-dtb"
DTB="dtb.img"
DTBO="dtbo.img"
VERSIONS="11-17"
BANNER="sweet (SM6150)"
DEVICE_1="sweet"
DEVICE_2="sweetin"
ZIP_PREFIX="neon-miui-sweet-bpfspoof-sm6150"
IS_EXTENSIVE_DEVICE="false"
IS_ANYKERNEL3="true"
