# Common kernel settings
KERNEL_REPO="https://github.com/pix106/android_kernel_xiaomi_sdm660_southwest-ng.git"
KERNEL_BRANCH="main"
KERNEL_DIR="android_kernel_xiaomi_sdm660"
IS_DEPTH_CLONE="true"

# Kernel's config settings
MAIN_DEFCONFIG="vendor/xiaomi/sdm660_defconfig"
COMMON_DEFCONFIG=""
DEVICE_DEFCONFIG="vendor/xiaomi/clover.config"
FEATURE_DEFCONFIG=""
IS_SYNCCONFIG="false"
IS_SPOOF_DEFCONFIG="true"

# Maintainer info
KBUILD_BUILD_USER="riarumoda"
KBUILD_BUILD_HOST="flexgroups"

# Goodies settings
KERNELSU="true"
BBG="true"
NOMOUNT="true"
DROIDSPACES="true"

# AnyKernel3 settings
IMAGE="Image.gz-dtb"
DTB=""
DTBO=""
VERSIONS="11-17"
BANNER="clover (SDM660)"
DEVICE_1="clover"
DEVICE_2="cloverin"
ZIP_PREFIX="neon-southwestng-main-clover-sdm660"
IS_EXTENSIVE_DEVICE="false"
IS_ANYKERNEL3="true"
