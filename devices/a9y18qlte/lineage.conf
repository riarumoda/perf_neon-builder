# Common kernel settings
KERNEL_REPO="https://github.com/a9y18qlte-open/android_kernel_samsung_a9y18qlte.git"
KERNEL_BRANCH="lineage-23.2"
KERNEL_DIR="android_kernel_samsung_a9y18qlte"
IS_DEPTH_CLONE="true"

# Kernel's config settings
MAIN_DEFCONFIG="vendor/sdm660-perf_defconfig"
COMMON_DEFCONFIG=""
DEVICE_DEFCONFIG="vendor/a9y18qlte.config"
FEATURE_DEFCONFIG=""
IS_SYNCCONFIG="false"
IS_SPOOF_DEFCONFIG="true"

# Maintainer info
KBUILD_BUILD_USER="riarumoda"
KBUILD_BUILD_HOST="flexgroups"

# Goodies settings
KERNELSU="true"
BBG="true"
NOMOUNT="true"
DROIDSPACES="true"

# AnyKernel3 settings
IMAGE="Image.gz-dtb"
DTB=""
DTBO=""
# The device skipped LineageOS 19.1 ~ 21, so only Android 15 ~ 17 is targeted.
VERSIONS="15-17"
BANNER="a9y18qlte (SDM660)"
DEVICE_1="a9y18qlte"
DEVICE_2="a9y18qlte"
ZIP_PREFIX="neon-lineage-a9y18qlte-sdm660"
IS_EXTENSIVE_DEVICE="false"
IS_ANYKERNEL3="true"
