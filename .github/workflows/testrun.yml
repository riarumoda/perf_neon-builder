name: Build & Test Run

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.ts.outputs.DATE }}
      build_type: ${{ steps.ts.outputs.KERNEL_BUILD_TYPE }}
    steps:
      - id: ts
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "KERNEL_BUILD_TYPE=Testing" >> $GITHUB_OUTPUT

  # device workflow imports goes in here
  build-miui-sm6150:
    needs: setup
    uses: ./.github/workflows/miui-sm6150.yml
    with:
      build_date: ${{ needs.setup.outputs.build_date }}
      build_type: ${{ needs.setup.outputs.build_type }}
    secrets: inherit



