name: Build & Test Run

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'device:os pairs, space/comma separated (e.g. "sweet:lineage a52sxq"). A device alone builds all its configs. Empty = every device.'
        required: false
        type: string
        default: ''

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.ts.outputs.DATE }}
      build_type: ${{ steps.ts.outputs.KERNEL_BUILD_TYPE }}
    steps:
      - id: ts
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "KERNEL_BUILD_TYPE=Testing" >> $GITHUB_OUTPUT

  # Empty targets = every devices/<device>/<os>.conf, otherwise only the
  # selected configs are compiled. No release is created for test runs.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.devices.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect device configs
        id: devices
        env:
          TARGETS: ${{ inputs.targets }}
        run: echo "matrix=$(python3 .github/scripts/matrix.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: [setup, discover]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build-device.yml
    with:
      device: ${{ matrix.device }}
      os: ${{ matrix.os }}
      build_date: ${{ needs.setup.outputs.build_date }}
      build_type: ${{ needs.setup.outputs.build_type }}
      artifact_retention_days: 7
    secrets: inherit
