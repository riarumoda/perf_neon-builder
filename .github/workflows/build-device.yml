name: Device Build

on:
  workflow_call:
    inputs:
      device:
        description: Device directory name (devices/<device>/)
        required: true
        type: string
      os:
        description: Config name (devices/<device>/<os>.conf)
        required: true
        type: string
      build_date:
        required: true
        type: string
      build_type:
        required: true
        type: string
      artifact_retention_days:
        required: false
        type: number
        default: 14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_ctime,include_file_mtime
    steps:
      - uses: actions/checkout@v7

      # Scope caches by kernel tree: configs of the same device can use
      # different trees (a52sxq lineage vs bonemachine), and restoring another
      # tree's ccache is 2 GB of downloads with almost no hits.
      - name: Resolve ccache scope
        id: ccache
        run: |
          kernel=$(sed -n 's/^KERNEL_DIR="\(.*\)"$/\1/p' "devices/${{ inputs.device }}/${{ inputs.os }}.conf" | head -n1)
          echo "kernel=${kernel:-${{ inputs.device }}}" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache/${{ steps.ccache.outputs.kernel }}/${{ inputs.os }}/${{ inputs.device }}/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache/${{ steps.ccache.outputs.kernel }}/${{ inputs.os }}/${{ inputs.device }}/
            ccache/${{ steps.ccache.outputs.kernel }}/${{ inputs.os }}/
            ccache/${{ steps.ccache.outputs.kernel }}/

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt purge -y firefox google-chrome-stable || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt; fi
          sudo find /etc/apt/ -type f \( -name "*.list" -o -name "*.sources" \) -exec sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' {} +
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex zip p7zip-full libc6 curl libstdc++6 git wget libssl-dev zstd lld python3 patchutils ccache libc6-dev unzip cpio

      - name: Build ${{ inputs.device }} (${{ inputs.os }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DATE: ${{ inputs.build_date }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          chmod +x build.sh
          ./build.sh "${{ inputs.device }}" "${{ inputs.os }}"

      - name: ccache stats
        if: always()
        run: ccache -s -v || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.device }}-${{ inputs.os }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
          path: |
            *.zip
            release_info.txt
            build.log
            config.log
            final.config
