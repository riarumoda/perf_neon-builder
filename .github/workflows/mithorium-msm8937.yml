name: Device Build - MSM8937 (Mi-Thorium)

on:
  workflow_call:
    inputs:
      build_date:
        required: true
        type: string
      build_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        devices: [mi89x7, mi439]
    
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        id: install_deps
        run: |
            sudo apt purge -y firefox google-chrome-stable
            if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt; fi
            sudo find /etc/apt/ -type f \( -name "*.list" -o -name "*.sources" \) -exec sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' {} +
            sudo apt-get update && sudo apt-get upgrade -y
            sudo apt-get install -y bc build-essential bison flex zip p7zip-full libc6 curl libstdc++6 git wget libssl-dev zstd lld python3 patchutils ccache libc6-dev unzip

      - name: Setup Kernel source & Variables
        id: vars
        run: |
            echo "- Setting up github token so it doesn't fail again..."
            git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

            echo "-- Exporting kernel settings..."
            export KERNEL_REPO="https://github.com/Mi-Thorium/kernel_msm-4.19.git"
            export KERNEL_BRANCH="mithorium/a13/master"
            export KERNEL_DIR="android_kernel_xiaomi_msm8937"
            
            echo "-- Exporting extra repositories..."
            export KERNEL_DT_COMMON_REPO="https://github.com/Mi-Thorium/kernel_devicetree_msm-4.19.git"
            export KERNEL_DT_COMMON_BRANCH="dts/master"
            export KERNEL_DT_COMMON_DIR="arch/arm64/boot/dts/vendor-legacy"

            export KERNEL_DT_MI89X7_REPO="https://github.com/Mi-Thorium/kernel_devicetree_xiaomi-msm8937.git"
            export KERNEL_DT_MI89X7_BRANCH="dts/mi8937/4.19/master"
            export KERNEL_DT_MI89X7_DIR="arch/arm64/boot/dts/xiaomi-msm8937"

            export KERNEL_DT_MI439_REPO="https://github.com/Mi-Thorium/kernel_devicetree_xiaomi-sdm439.git"
            export KERNEL_DT_MI439_BRANCH="dts/mi439/4.19/master"
            export KERNEL_DT_MI439_DIR="arch/arm64/boot/dts/xiaomi-sdm439"

            export KERNEL_TP_MI89X7_REPO="https://github.com/Mi-Thorium/kernel_techpack_xiaomi-msm8937.git"
            export KERNEL_TP_MI89X7_BRANCH="techpack/mi8937/4.19/master"
            export KERNEL_TP_MI89X7_DIR="techpack/xiaomi-msm8937"

            export KERNEL_TP_MI439_REPO="https://github.com/Mi-Thorium/kernel_techpack_xiaomi-sdm439.git"
            export KERNEL_TP_MI439_BRANCH="techpack/mi439/4.19/master"
            export KERNEL_TP_MI439_DIR="techpack/xiaomi-sdm439"

            export KERNEL_TP_AUDIO_REPO="https://github.com/Mi-Thorium/kernel_techpack_audio-legacy.git"
            export KERNEL_TP_AUDIO_BRANCH="audio/4.19/mithorium/master"
            export KERNEL_TP_AUDIO_DIR="techpack/audio-legacy"

            export KERNEL_TP_CAMERAN_REPO="https://github.com/Mi-Thorium/kernel_techpack_camera-legacy.git"
            export KERNEL_TP_CAMERAN_BRANCH="camera/LA.UM.8.6.r1-05300-89xx.0/4.19/mithorium"
            export KERNEL_TP_CAMERAN_DIR="techpack/camera-legacy"

            export KERNEL_TP_CAMERAM_REPO="https://github.com/Mi-Thorium/kernel_techpack_camera-legacy.git"
            export KERNEL_TP_CAMERAM_BRANCH="camera/LA.UM.5.3-10610-89xx.0/4.19/mithorium"
            export KERNEL_TP_CAMERAM_DIR="techpack/camera-legacy-m"

            export KERNEL_WLAN_PRIMA_REPO="https://github.com/Mi-Thorium/vendor_qcom_opensource_wlan_prima.git"
            export KERNEL_WLAN_PRIMA_BRANCH="wlan/LA.UM.9.6.4/mithorium/master"
            export KERNEL_WLAN_PRIMA_DIR="drivers/staging/prima"

            echo "-- Exporting variables into GITHUB_ENV..."
            echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
            echo "MAKE_ARGS=ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
            echo "KBUILD_BUILD_USER="riarumoda"" >> $GITHUB_ENV
            echo "KBUILD_BUILD_HOST="flexgroups"" >> $GITHUB_ENV
            echo "DEVICE_NAME="${{ matrix.devices }}"" >> $GITHUB_ENV
            echo "KERNEL_VERSION="4.19"" >> $GITHUB_ENV

            echo "-- Exporting toolchain settings..."
            TC_URLS="$(curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest | grep -o '"browser_download_url": *"[^"]*"' | head -n 1 | cut -d '"' -f 4)"
            [ -n "$TC_URLS" ] || { echo "ERROR: could not resolve toolchain URL"; exit 1; }
            
            echo "-- Cloning kernel repository..."
            git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR" &> /dev/null

            echo "-- Cloning extra repositories..."
            cd "$KERNEL_DIR"
            git clone --depth=1 --branch "$KERNEL_DT_COMMON_BRANCH" "$KERNEL_DT_COMMON_REPO" "$KERNEL_DT_COMMON_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_DT_MI89X7_BRANCH" "$KERNEL_DT_MI89X7_REPO" "$KERNEL_DT_MI89X7_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_DT_MI439_BRANCH" "$KERNEL_DT_MI439_REPO" "$KERNEL_DT_MI439_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_TP_MI89X7_BRANCH" "$KERNEL_TP_MI89X7_REPO" "$KERNEL_TP_MI89X7_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_TP_MI439_BRANCH" "$KERNEL_TP_MI439_REPO" "$KERNEL_TP_MI439_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_TP_AUDIO_BRANCH" "$KERNEL_TP_AUDIO_REPO" "$KERNEL_TP_AUDIO_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_TP_CAMERAN_BRANCH" "$KERNEL_TP_CAMERAN_REPO" "$KERNEL_TP_CAMERAN_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_TP_CAMERAM_BRANCH" "$KERNEL_TP_CAMERAM_REPO" "$KERNEL_TP_CAMERAM_DIR" &> /dev/null
            git clone --depth=1 --branch "$KERNEL_WLAN_PRIMA_BRANCH" "$KERNEL_WLAN_PRIMA_REPO" "$KERNEL_WLAN_PRIMA_DIR" &> /dev/null
            cd ..

            echo "-- Exporting variables into GITHUB_PATH..."
            echo "$PWD/$KERNEL_DIR/clang/bin" >> $GITHUB_PATH

            echo "-- Downloading toolchain..."
            mkdir -p "$KERNEL_DIR/clang"
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "$KERNEL_DIR/neutron-clang.tar.zst" "$TC_URLS"
            tar --zstd -C "$KERNEL_DIR/clang" -xf "$KERNEL_DIR/neutron-clang.tar.zst"
            rm -f "$KERNEL_DIR/neutron-clang.tar.zst"

      - name: Generate kernel configs
        id: generate_configs
        run: |
            echo "-- Exporting kernel configs..."
            export ACTUAL_MAIN_DEFCONFIG="arch/arm64/configs/vendor/msm8937-perf_defconfig"
            export MAIN_DEFCONFIG="vendor/msm8937-perf_defconfig"
            export FEATURE_DEFCONFIG="vendor/feature/android-12.config vendor/feature/compat-vdso.config vendor/feature/erofs.config vendor/feature/exfat.config vendor/feature/kprobes.config vendor/feature/lmkd.config vendor/feature/ntfs.config vendor/feature/wireguard.config"

            echo "-- Exporting device-related kernel settings..."
            export DEVICE_LIST="${{ matrix.devices }}"
            if [[ "$DEVICE_LIST" == "mi89x7" ]]; then
              export COMMON_DEFCONFIG="vendor/msm8937-legacy.config vendor/common.config vendor/msm-clk.config"
              export DEVICE_DEFCONFIG="vendor/xiaomi/msm8937/common.config vendor/xiaomi/msm8937/mi8937.config"
            elif [[ "$DEVICE_LIST" == "mi439" ]]; then
              export COMMON_DEFCONFIG="vendor/common.config vendor/msm-clk.config"
              export DEVICE_DEFCONFIG="vendor/xiaomi/sdm439/mi439.config"
            fi

            echo "-- Exporting kernel configs into GITHUB_ENV..."
            echo "ACTUAL_MAIN_DEFCONFIG=$ACTUAL_MAIN_DEFCONFIG" >> $GITHUB_ENV
            echo "MAIN_DEFCONFIG=$MAIN_DEFCONFIG" >> $GITHUB_ENV
            echo "COMMON_DEFCONFIG=$COMMON_DEFCONFIG" >> $GITHUB_ENV
            echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG" >> $GITHUB_ENV
            echo "FEATURE_DEFCONFIG=$FEATURE_DEFCONFIG" >> $GITHUB_ENV

            echo "-- Generating generic kernel config..."
            cd $KERNEL_DIR
            mkdir -p out &> /dev/null
            make O=out $MAKE_ARGS "$MAIN_DEFCONFIG" &> /dev/null

            echo "-- Appending fragments to .config..."
            for fragment in $COMMON_DEFCONFIG $DEVICE_DEFCONFIG $FEATURE_DEFCONFIG; do
                if [ -f "arch/arm64/configs/$fragment" ]; then
                    echo "   -> Merging $fragment..."
                    cat "arch/arm64/configs/$fragment" >> out/.config
                else
                    echo "   -> Warning: Fragment arch/arm64/configs/$fragment not found!"
                fi
            done

            echo "-- Executing olddefconfig and silentoldconfig..."
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig &> /dev/null
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS silentoldconfig &> /dev/null

            echo "-- Copying merged config to defconfig directory..."
            cp out/.config arch/arm64/configs/"${{ matrix.devices }}"_stock_defconfig
            cp out/.config arch/arm64/configs/"${{ matrix.devices }}"_defconfig

            echo "-- Cleaning up..."
            rm -rf out &> /dev/null

            echo "-- Exporting finalized kernel config..."
            export FINAL_DEFCONFIG="arch/arm64/configs/${{ matrix.devices }}_defconfig"
            echo "FINAL_DEFCONFIG=$FINAL_DEFCONFIG" >> $GITHUB_ENV
            echo "COMPILE_DEFCONFIG=${{ matrix.devices }}_defconfig" >> $GITHUB_ENV

            echo "-- Hard code config.gz into kernel..."
            sed -i 's|\$(KCONFIG_CONFIG)|arch/arm64/configs/'"${{ matrix.devices }}"'_stock_defconfig|g' kernel/Makefile
            cd ..

      - name: Apply device related patches
        id: apply_patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            echo "-- Exporting device patches..."
            export KSU_REVERT="https://github.com/Mi-Thorium/kernel_msm-4.19/commit/624875e8edc36ae280b1f8efc1d3c48a28da64ea.patch"

            echo "-- Importing patch helper script..."
            source scripts/patch-helper.sh

            echo "-- Applying device specific patches..."
            cd "$KERNEL_DIR"

            echo "-- Reverting KSU commit..."
            revert_commit "$KSU_REVERT"

            echo "-- Fixing HW key for riva..."
            sed -i 's/#define FTS_POINT_REPORT_CHECK_EN[[:space:]]*0/#define FTS_POINT_REPORT_CHECK_EN               1/g' techpack/xiaomi-msm8937/touchscreen/focaltech_touch/focaltech_common.h
            sed -i '/input_report_key(input_dev, BTN_TOUCH, 0);/a \
                if (ts_data->key_state) {\
                    struct fts_ts_platform_data *pdata = ts_data->pdata;\
                    int key_idx;\
                    int num_keys = 0;\
                    u32 *keycodes = NULL;\
            \
                if (pdata->key_is_vkeys && pdata->vkeys_pdata) {\
                        num_keys = pdata->vkeys_pdata->num_keys;\
                        keycodes = pdata->vkeys_pdata->keycodes;\
                } else if (!pdata->key_is_vkeys) {\
                        num_keys = pdata->key_number;\
                        keycodes = pdata->keys;\
                }\
            \
                if (keycodes) {\
                        for (key_idx = 0; key_idx < num_keys; key_idx++) {\
                                if (ts_data->key_state & (1 << key_idx))\
                                        input_report_key(input_dev, keycodes[key_idx], 0);\
                        }\
                }\
                ts_data->key_state = 0;\
            }' techpack/xiaomi-msm8937/touchscreen/focaltech_touch/focaltech_point_report_check.c

            echo "-- Getting rid of the dirty flag..."
            sed -i "s/printf '%s' -dirty/:/g" scripts/setlocalversion

            echo "-- Disabling IKHeaders..."
            sed -i 's/CONFIG_IKHEADERS=y/# CONFIG_IKHEADERS is not set/g' $FINAL_DEFCONFIG

            echo "-- Tuning default configs..."
            echo "CONFIG_LTO_CLANG=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_THINLTO=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_MODULE_REL_CRCS=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_CRYPT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_DEFAULT_KEY=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_SNAPSHOT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_UEVENT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_VERITY=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_VERITY_FEC=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_BOW=y" >> $FINAL_DEFCONFIG

            echo "-- Tuning compiler flags..."
            sed -i 's/-Wno-format-security/-Wno-format-security -Wno-declaration-after-statement -Wno-implicit-int -Wno-enum-conversion -Wno-default-const-init-var-unsafe -Wno-default-const-init-field-unsafe -Wno-misleading-indentation -Wno-unsequenced -Wno-sizeof-pointer-memaccess -Wno-implicit-function-declaration -Wno-implicit-enum-enum-cast/g' Makefile
            sed -i '/export KBUILD_CFLAGS/i KBUILD_CFLAGS += -mllvm -polly -mllvm -enable-gvn-hoist -Wno-unused-command-line-argument' Makefile
            cd ..

      - name: Apply goodies
        id: goodies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            echo "-- Exporting goodies settings..."
            export KERNELSU_SELECTOR="baka-susfs"
            export BBG_SELECTOR="bbg"
            export NOMOUNT_SELECTOR="nomount-edge"
            export DROIDSPACES_SELECTOR="droidspaces"

            echo "-- Running goodies script..."
            cp goodies.sh "$KERNEL_DIR/"
            cp -r scripts/* "$KERNEL_DIR/scripts/"
            cd "$KERNEL_DIR"
            chmod +x goodies.sh
            bash goodies.sh
            cd ..

      - name: Compile the kernel
        run: |
            echo "-- Prepping build environment..."
            cd "$KERNEL_DIR"
            mkdir -p out &> /dev/null

            echo "-- Parsing final defconfig..."
            make O=out $MAKE_ARGS $COMPILE_DEFCONFIG &> /dev/null

            echo "-- Executing olddefconfig and silentoldconfig..."
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig &> /dev/null
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS silentoldconfig &> /dev/null

            echo "-- Compiling the kernel..."
            make -j$(nproc --all) O=out $MAKE_ARGS 2>&1 | tee build.log

            echo "-- Exporting build versions..."
            export KSU_NAME=$(grep -m 1 -e "-- BakaSU version name:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export KSU_CODE=$(grep -m 1 -e "-- BakaSU version code:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export SUSFS_VER=$(grep -m 1 -e "-- SUSFS_VERSION:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export BBG_VER=$(grep -m 1 -e "-- BBG version:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export NOMOUNT_VER=$(grep -m 1 "NOMOUNT_BASE_VERSION" fs/nomount/nomount.h 2>/dev/null | awk -F'"' '{print $2}' | tr -d '[:space:]')
            cp build.log ../build.log
            cd ..

            echo "-- Writing release info.txt..."
            echo "KSU_NAME=${KSU_NAME:-N/A}" >> release_info.txt
            echo "KSU_CODE=${KSU_CODE:-N/A}" >> release_info.txt
            echo "SUSFS_VER=${SUSFS_VER:-N/A}" >> release_info.txt
            echo "BBG_VER=${BBG_VER:-N/A}" >> release_info.txt
            echo "NOMOUNT_VER=${NOMOUNT_VER:-N/A}" >> release_info.txt

      - name: Preparing AnyKernel3 sources
        run: |
            echo "-- Exporting AnyKernel3 settings..."
            export IMAGE="Image.gz-dtb"
            export DTB=""
            export DTBO=""
            export VERSIONS="11-17"
            export DEVICE_LIST="${{ matrix.devices }}"

            echo "-- Exporting Banner settings..."
            if [[ "$DEVICE_LIST" == "mi89x7" ]]; then
              export BANNER=" ${{ matrix.devices }} (MSM8937)"
            elif [[ "$DEVICE_LIST" == "mi439" ]]; then
              export BANNER=" ${{ matrix.devices }} (SDM439)"
            fi

            echo "-- Cloning AnyKernel3 repository..."
            rm -rf AnyKernel3
            git clone https://github.com/riarumoda/AnyKernel3 AnyKernel3 --depth=1

            echo "-- Copying kernel image and dtb/dtbo to AnyKernel3..."
            cp "$KERNEL_DIR/out/arch/arm64/boot/$IMAGE" AnyKernel3/
            if [ -n "$DTB" ] && [ -f "$KERNEL_DIR/out/arch/arm64/boot/$DTB" ]; then cp "$KERNEL_DIR/out/arch/arm64/boot/$DTB" AnyKernel3/; fi
            if [ -n "$DTBO" ] && [ -f "$KERNEL_DIR/out/arch/arm64/boot/$DTBO" ]; then cp "$KERNEL_DIR/out/arch/arm64/boot/$DTBO" AnyKernel3/; fi

            echo "-- Updating AnyKernel3 settings..."
            sed -i "s/supported.versions=11-16/supported.versions=$VERSIONS/" AnyKernel3/anykernel.sh
            sed -i "s/sweet (sm6150)/$BANNER/g" AnyKernel3/banner

            echo "-- Updating AnyKernel3 device name..."
            if [[ "$DEVICE_LIST" == "mi89x7" ]]; then
                sed -i 's/device.name1=sweet/device.name1=mi8937/' AnyKernel3/anykernel.sh
                sed -i 's/device.name2=sweetin/device.name2=mi8917/' AnyKernel3/anykernel.sh
                sed -i '/device.name2=mi8917/a device.name3=santoni\ndevice.name4=prada\ndevice.name5=rolex\ndevice.name6=ugglite\ndevice.name7=riva\ndevice.name8=ugg\ndevice.name9=land' AnyKernel3/anykernel.sh
            elif [[ "$DEVICE_LIST" == "mi439" ]]; then
                sed -i 's/device.name1=sweet/device.name1=mi439/' AnyKernel3/anykernel.sh
                sed -i 's/device.name2=sweetin/device.name2=pine/' AnyKernel3/anykernel.sh
                sed -i '/device.name2=pine/a device.name3=olive\ndevice.name4=olivelite\ndevice.name5=olivewood' AnyKernel3/anykernel.sh
            fi

            echo "-- Updating kernel build type..."
            sed -i 's/KERNEL_BUILD_TYPE="Weekly"/KERNEL_BUILD_TYPE="${{ inputs.build_type }}"/' AnyKernel3/anykernel.sh

      - name: Pack kernel with AnyKernel3
        run: |
            echo "-- Exporting zip settings..."
            export DEVICE_LIST="${{ matrix.devices }}"
            if [[ "$DEVICE_LIST" == "mi89x7" ]]; then
              export ZIP_PREFIX="neon-mithorium-${{ matrix.devices }}-msm8937"
            elif [[ "$DEVICE_LIST" == "mi439" ]]; then
              export ZIP_PREFIX="neon-mithorium-${{ matrix.devices }}-sdm439"
            fi
            export ZIPNAME="${ZIP_PREFIX}-${{ inputs.build_date }}.zip"

            cd AnyKernel3
            zip -rq9 "../$ZIPNAME" ./*
            cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mithorium-${{ matrix.devices }}
          path: |
            *.zip
            release_info.txt
            build.log