name: Device Build - SM6150 (PixelOS)

on:
  workflow_call:
    inputs:
      build_date:
        required: true
        type: string
      build_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        devices: [sweet, toco]
    
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        id: install_deps
        run: |
            sudo apt purge -y firefox google-chrome-stable
            if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt; fi
            sudo find /etc/apt/ -type f \( -name "*.list" -o -name "*.sources" \) -exec sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' {} +
            sudo apt-get update && sudo apt-get upgrade -y
            sudo apt-get install -y bc build-essential bison flex zip p7zip-full libc6 curl libstdc++6 git wget libssl-dev zstd lld python3 patchutils ccache libc6-dev unzip

      - name: Setup Kernel source & Variables
        id: vars
        run: |
            echo "-- Exporting kernel settings..."
            export KERNEL_REPO="https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150.git"
            export KERNEL_BRANCH="seventeen"
            export KERNEL_DIR="android_kernel_xiaomi_sm6150"
            
            echo "-- Exporting variables into GITHUB_ENV..."
            echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
            echo "MAKE_ARGS=ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
            echo "KBUILD_BUILD_USER="riarumoda"" >> $GITHUB_ENV
            echo "KBUILD_BUILD_HOST="flexgroups"" >> $GITHUB_ENV
            echo "DEVICE_NAME="${{ matrix.devices }}"" >> $GITHUB_ENV
            echo "KERNEL_VERSION="4.14"" >> $GITHUB_ENV

            echo "-- Exporting toolchain settings..."
            export TC_URLS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest | grep "browser_download_url" | head -n 1 | cut -d '"' -f 4) 
            
            echo "-- Cloning kernel repository..."
            git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR" &> /dev/null

            echo "-- Exporting variables into GITHUB_PATH..."
            echo "$PWD/$KERNEL_DIR/clang/bin" >> $GITHUB_PATH

            echo "-- Downloading toolchain..."
            cd $KERNEL_DIR
            curl -L -O "$TC_URLS"
            mkdir -p clang
            tar -C clang -xf neutron-clang-*.tar.zst
            rm -rf neutron-clang-*.tar.zst
            cd ..

      - name: Generate kernel configs
        id: generate_configs
        run: |
            echo "-- Exporting kernel configs..."
            export ACTUAL_MAIN_DEFCONFIG="arch/arm64/configs/${DEVICE_NAME}_defconfig"
            export MAIN_DEFCONFIG="${DEVICE_NAME}_defconfig"
            export COMMON_DEFCONFIG="vendor/debugfs.config"
            export DEVICE_DEFCONFIG=""
            export FEATURE_DEFCONFIG=""

            echo "-- Exporting kernel configs into GITHUB_ENV..."
            echo "ACTUAL_MAIN_DEFCONFIG=$ACTUAL_MAIN_DEFCONFIG" >> $GITHUB_ENV
            echo "MAIN_DEFCONFIG=$MAIN_DEFCONFIG" >> $GITHUB_ENV
            echo "COMMON_DEFCONFIG=$COMMON_DEFCONFIG" >> $GITHUB_ENV
            echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG" >> $GITHUB_ENV
            echo "FEATURE_DEFCONFIG=$FEATURE_DEFCONFIG" >> $GITHUB_ENV

            echo "-- Generating generic kernel config..."
            cd $KERNEL_DIR
            mkdir -p out &> /dev/null
            make O=out $MAKE_ARGS "$MAIN_DEFCONFIG" &> /dev/null

            echo "-- Appending fragments to .config..."
            for fragment in $COMMON_DEFCONFIG $DEVICE_DEFCONFIG $FEATURE_DEFCONFIG; do
                if [ -f "arch/arm64/configs/$fragment" ]; then
                    echo "   -> Merging $fragment..."
                    cat "arch/arm64/configs/$fragment" >> out/.config
                else
                    echo "   -> Warning: Fragment arch/arm64/configs/$fragment not found!"
                fi
            done

            echo "-- Executing olddefconfig and silentoldconfig..."
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig &> /dev/null
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS silentoldconfig &> /dev/null

            echo "-- Copying merged config to defconfig directory..."
            cp out/.config arch/arm64/configs/"${{ matrix.devices }}"_defconfig

            echo "-- Cleaning up..."
            rm -rf out &> /dev/null

            echo "-- Exporting finalized kernel config..."
            export FINAL_DEFCONFIG="arch/arm64/configs/${{ matrix.devices }}_defconfig"
            echo "FINAL_DEFCONFIG=$FINAL_DEFCONFIG" >> $GITHUB_ENV
            echo "COMPILE_DEFCONFIG=${{ matrix.devices }}_defconfig" >> $GITHUB_ENV
            cd ..

      - name: Apply device related patches
        id: apply_patches
        run: |
            echo "-- Importing patch helper script..."
            source scripts/patch-helper.sh

            echo "-- Applying device specific patches..."
            cd "$KERNEL_DIR"

            echo "-- Fixing fair scheduler..."
            sed -i -e 's/update_load_avg(qcfs_rq, se, 0);/update_load_avg(se, 0);/g' \
                   -e 's/update_load_avg(cfs_rq, se, 0);/update_load_avg(se, 0);/g' \
                   kernel/sched/fair.c
            sed -i '/se_update_runnable/d' kernel/sched/fair.c
            sed -i '/assert_list_leaf_cfs_rq/d' kernel/sched/fair.c

            echo "-- Disabling modversions..."
            sed -i 's/^CONFIG_MODVERSIONS=y/# CONFIG_MODVERSIONS is not set/' $FINAL_DEFCONFIG

            echo "-- Tuning default configs..."
            echo "CONFIG_LTO_CLANG=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_THINLTO=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_MODULE_REL_CRCS=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_CRYPT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_DEFAULT_KEY=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_SNAPSHOT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_UEVENT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_VERITY=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_VERITY_FEC=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_BOW=y" >> $FINAL_DEFCONFIG

            echo "-- Tuning compiler flags..."
            sed -i 's/-Wno-format-security/-Wno-format-security -Wno-implicit-int -Wno-enum-conversion -Wno-default-const-init-var-unsafe -Wno-default-const-init-field-unsafe -Wno-misleading-indentation -Wno-unsequenced -Wno-sizeof-pointer-memaccess -Wno-implicit-function-declaration -Wno-implicit-enum-enum-cast/g' Makefile
            sed -i '/export KBUILD_CFLAGS/i KBUILD_CFLAGS += -mllvm -polly -mllvm -enable-gvn-hoist -Wno-unused-command-line-argument' Makefile
            cd ..

      - name: Apply goodies
        id: goodies
        run: |
            echo "-- Exporting goodies settings..."
            export KERNELSU_SELECTOR="baka-susfs"
            export BBG_SELECTOR="bbg"
            export NOMOUNT_SELECTOR="nomount"
            export DROIDSPACES_SELECTOR="none"

            echo "-- Running goodies script..."
            cp goodies.sh "$KERNEL_DIR/"
            cp -r scripts/* "$KERNEL_DIR/scripts/"
            cd "$KERNEL_DIR"
            chmod +x goodies.sh
            bash goodies.sh
            cd ..

      - name: Compile the kernel
        run: |
            echo "-- Prepping build environment..."
            cd "$KERNEL_DIR"
            mkdir -p out &> /dev/null

            echo "-- Parsing final defconfig..."
            make O=out $MAKE_ARGS $COMPILE_DEFCONFIG &> /dev/null

            echo "-- Executing olddefconfig and silentoldconfig..."
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig &> /dev/null
            { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS silentoldconfig &> /dev/null

            echo "-- Compiling the kernel..."
            make -j$(nproc --all) O=out $MAKE_ARGS 2>&1 | tee build.log

            echo "-- Exporting build versions..."
            export KSU_NAME=$(grep -m 1 -e "-- BakaSU version name:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export KSU_CODE=$(grep -m 1 -e "-- BakaSU version code:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export SUSFS_VER=$(grep -m 1 -e "-- SUSFS_VERSION:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export BBG_VER=$(grep -m 1 -e "-- BBG version:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export NOMOUNT_VER=$(grep -m 1 "NOMOUNT_BASE_VERSION" fs/nomount/nomount.h 2>/dev/null | awk -F'"' '{print $2}' | tr -d '[:space:]')
            cp build.log ../build.log
            cd ..

            echo "-- Writing release info.txt..."
            echo "KSU_NAME=${KSU_NAME:-N/A}" >> release_info.txt
            echo "KSU_CODE=${KSU_CODE:-N/A}" >> release_info.txt
            echo "SUSFS_VER=${SUSFS_VER:-N/A}" >> release_info.txt
            echo "BBG_VER=${BBG_VER:-N/A}" >> release_info.txt
            echo "NOMOUNT_VER=${NOMOUNT_VER:-N/A}" >> release_info.txt

      - name: Preparing AnyKernel3 sources
        run: |
            echo "-- Exporting AnyKernel3 settings..."
            export IMAGE="Image.gz"
            export DTB=""
            export DTBO="dtbo.img"
            export VERSIONS="13-17"
            export BANNER=" ${{ matrix.devices }} (SM6150)"
            export DEVICE_LIST="${{ matrix.devices }}"

            echo "-- Cloning AnyKernel3 repository..."
            rm -rf AnyKernel3
            git clone https://github.com/riarumoda/AnyKernel3 AnyKernel3 --depth=1

            echo "-- Copying kernel image and dtb/dtbo to AnyKernel3..."
            cp "$KERNEL_DIR/out/arch/arm64/boot/$IMAGE" AnyKernel3/
            if [ -n "$DTB" ] && [ -f "$KERNEL_DIR/out/arch/arm64/boot/$DTB" ]; then cp "$KERNEL_DIR/out/arch/arm64/boot/$DTB" AnyKernel3/; fi
            if [ -n "$DTBO" ] && [ -f "$KERNEL_DIR/out/arch/arm64/boot/$DTBO" ]; then cp "$KERNEL_DIR/out/arch/arm64/boot/$DTBO" AnyKernel3/; fi

            echo "-- Updating AnyKernel3 settings..."
            sed -i "s/supported.versions=11-16/supported.versions=$VERSIONS/" AnyKernel3/anykernel.sh
            sed -i "s/sweet (sm6150)/$BANNER/g" AnyKernel3/banner

            echo "-- Updating AnyKernel3 device name..."
            if [[ "$DEVICE_LIST" == "sweet" ]]; then
                sed -i 's/device.name1=sweet/device.name1=sweet/g' AnyKernel3/anykernel.sh
                sed -i 's/device.name2=sweetin/device.name2=sweetin/g' AnyKernel3/anykernel.sh
            elif [[ "$DEVICE_LIST" == "toco" ]]; then
                sed -i 's/device.name1=sweet/device.name1=toco/g' AnyKernel3/anykernel.sh
                sed -i 's/device.name2=sweetin/device.name2=tocoin/g' AnyKernel3/anykernel.sh
            fi

            echo "-- Updating kernel build type..."
            sed -i 's/KERNEL_BUILD_TYPE="Weekly"/KERNEL_BUILD_TYPE="${{ inputs.build_type }}"/' AnyKernel3/anykernel.sh

      - name: Pack kernel with AnyKernel3
        run: |
            echo "-- Exporting zip settings..."
            export ZIP_PREFIX="neon-pixelos-${{ matrix.devices }}-sm6150"
            export ZIPNAME="${ZIP_PREFIX}-${{ inputs.build_date }}.zip"

            cd AnyKernel3
            zip -rq9 "../$ZIPNAME" ./*
            cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pixelos-${{ matrix.devices }}
          path: |
            *.zip
            release_info.txt
            build.log