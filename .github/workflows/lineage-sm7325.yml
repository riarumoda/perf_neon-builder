name: Device Build - SM7325 (LineageOS)

on:
  workflow_call:
    inputs:
      build_date:
        required: true
        type: string
      build_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        devices: [a52, a73, m52]
        root: [baka-susfs, none]
    
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        id: install_deps
        run: |
            sudo apt purge -y firefox google-chrome-stable
            if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt; fi
            sudo find /etc/apt/ -type f \( -name "*.list" -o -name "*.sources" \) -exec sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' {} +
            sudo apt-get update && sudo apt-get upgrade -y
            sudo apt-get install -y bc build-essential bison flex zip p7zip-full libc6 curl libstdc++6 git wget libssl-dev zstd lld python3 patchutils ccache libc6-dev unzip

      - name: Setup Kernel source & Variables
        id: vars
        run: |
            echo "- Setting up github token so it doesn't fail again..."
            git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
            
            echo "-- Exporting kernel settings..."
            export KERNEL_REPO="https://github.com/LineageOS/android_kernel_samsung_sm7325.git"
            export KERNEL_BRANCH="lineage-24.0"
            export KERNEL_DIR="android_kernel_samsung_sm7325"
            
            echo "-- Exporting variables into GITHUB_ENV..."
            echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
            echo "MAKE_ARGS=ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
            echo "KBUILD_BUILD_USER="isaiahscape"" >> $GITHUB_ENV
            echo "KBUILD_BUILD_HOST="flexgroups"" >> $GITHUB_ENV
            echo "DEVICE_NAME="${{ matrix.devices }}"" >> $GITHUB_ENV
            echo "KERNEL_VERSION="5.4"" >> $GITHUB_ENV

            echo "-- Exporting toolchain settings..."
            export TC_URLS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest | grep "browser_download_url" | head -n 1 | cut -d '"' -f 4) 
            
            echo "-- Cloning kernel repository..."
            git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR" &> /dev/null

            echo "-- Exporting variables into GITHUB_PATH..."
            echo "$PWD/$KERNEL_DIR/clang/bin" >> $GITHUB_PATH

            echo "-- Downloading toolchain..."
            cd $KERNEL_DIR
            curl -L -O "$TC_URLS"
            mkdir -p clang
            tar -C clang -xf neutron-clang-*.tar.zst
            rm -rf neutron-clang-*.tar.zst
            cd ..

            echo "-- Downloading magiskboot..."
            APK_URL="$(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases" | grep -oE 'https://[^\"]+\.apk' | grep 'Magisk[-.]v' | head -n 1)"
            curl -L -o magisk.apk "$APK_URL"
            unzip -p "magisk.apk" "lib/x86_64/libmagiskboot.so" > "$PWD/$KERNEL_DIR/clang/bin/magiskboot"
            chmod +x "$PWD/$KERNEL_DIR/clang/bin/magiskboot"

            echo "-- Downloading avbtool..."
            AVBTOOL_URL="https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT"
            curl -s "$AVBTOOL_URL" | base64 --decode > "$PWD/$KERNEL_DIR/clang/bin/avbtool"
            chmod +x "$PWD/$KERNEL_DIR/clang/bin/avbtool"

            echo "-- Downloading stock images..."
            mkdir -p "$PWD/$KERNEL_DIR/clang/bin/images/"
            if [[ ${{matrix.devices}} == "a52" ]]; then
              BOOT_URL="$(curl -s "https://download.lineageos.org/api/v2/devices/${{ matrix.devices }}sxq/builds" | grep -oE 'https://[^\"]+/boot\.img' | head -n 1)"
              if [[ -z "$BOOT_URL" ]]; then
                echo "ERROR: Could not find boot.img download link for ${{matrix.devices}}sxq"
                exit 1
              fi
              curl -sSL -o "$PWD/$KERNEL_DIR/clang/bin/images/boot.img" "$BOOT_URL"
            else
              BOOT_URL="$(curl -s "https://download.lineageos.org/api/v2/devices/${{ matrix.devices }}xq/builds" | grep -oE 'https://[^\"]+/boot\.img' | head -n 1)"
              if [[ -z "$BOOT_URL" ]]; then
                echo "ERROR: Could not find boot.img download link for ${{matrix.devices}}sxq"
                exit 1
              fi
              curl -sSL -o "$PWD/$KERNEL_DIR/clang/bin/images/boot.img" "$BOOT_URL"
            fi
            ls -alhZ $PWD/$KERNEL_DIR/clang/bin/images/

      - name: Generate kernel configs
        id: generate_configs
        run: |
            echo "-- Exporting kernel configs..."
            export ACTUAL_MAIN_DEFCONFIG="arch/arm64/configs/gki_defconfig"
            export MAIN_DEFCONFIG="gki_defconfig"
            export COMMON_DEFCONFIG="vendor/lahaina_GKI.config vendor/lahaina_QGKI.config"
            if [[ ${{matrix.devices}} == "a52" ]]; then
              export DEVICE_DEFCONFIG="vendor/lineage-${DEVICE_NAME}sxq_defconfig"
            else
              export DEVICE_DEFCONFIG="vendor/lineage-${DEVICE_NAME}xq_defconfig"
            fi
            export FEATURE_DEFCONFIG=""

            echo "-- Exporting kernel configs into GITHUB_ENV..."
            echo "ACTUAL_MAIN_DEFCONFIG=$ACTUAL_MAIN_DEFCONFIG" >> $GITHUB_ENV
            echo "MAIN_DEFCONFIG=$MAIN_DEFCONFIG" >> $GITHUB_ENV
            echo "COMMON_DEFCONFIG=$COMMON_DEFCONFIG" >> $GITHUB_ENV
            echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG" >> $GITHUB_ENV
            echo "FEATURE_DEFCONFIG=$FEATURE_DEFCONFIG" >> $GITHUB_ENV

            echo "-- Generating generic kernel config..."
            cd $KERNEL_DIR
            mkdir -p out &> /dev/null
            make O=$PWD/out $MAKE_ARGS "$MAIN_DEFCONFIG" &> /dev/null

            echo "-- Appending fragments to .config..."
            for fragment in $COMMON_DEFCONFIG $DEVICE_DEFCONFIG $FEATURE_DEFCONFIG; do
                if [ -f "arch/arm64/configs/$fragment" ]; then
                    echo "   -> Merging $fragment..."
                    cat "arch/arm64/configs/$fragment" >> out/.config
                else
                    echo "   -> Warning: Fragment arch/arm64/configs/$fragment not found!"
                fi
            done

            echo "-- Executing olddefconfig and syncconfig..."
            { yes "" 2>/dev/null || true; } | make O=$PWD/out $MAKE_ARGS olddefconfig &> /dev/null
            { yes "" 2>/dev/null || true; } | make O=$PWD/out $MAKE_ARGS syncconfig &> /dev/null

            echo "-- Copying merged config to defconfig directory..."
            cp out/.config arch/arm64/configs/"${{ matrix.devices }}"_stock_defconfig
            cp out/.config arch/arm64/configs/"${{ matrix.devices }}"_defconfig

            echo "-- Cleaning up..."
            rm -rf out &> /dev/null

            echo "-- Exporting finalized kernel config..."
            export FINAL_DEFCONFIG="arch/arm64/configs/${{ matrix.devices }}_defconfig"
            echo "FINAL_DEFCONFIG=$FINAL_DEFCONFIG" >> $GITHUB_ENV
            echo "COMPILE_DEFCONFIG=${{ matrix.devices }}_defconfig" >> $GITHUB_ENV

            echo "-- Hard code config.gz into kernel..."
            sed -i 's|\$(KCONFIG_CONFIG)|arch/arm64/configs/'"${{ matrix.devices }}"'_stock_defconfig|g' kernel/Makefile
            cd ..

      - name: Apply device related patches
        id: apply_patches
        run: |
            echo "-- Importing patch helper script..."
            source scripts/patch-helper.sh

            echo "-- Applying device specific patches..."
            cd "$KERNEL_DIR"

            echo "-- Getting rid of the dirty flag..."
            sed -i "s/printf '%s' -dirty/:/g" scripts/setlocalversion

            echo "-- Disabling IKHeaders..."
            sed -i 's/CONFIG_IKHEADERS=y/# CONFIG_IKHEADERS is not set/g' $FINAL_DEFCONFIG

            echo "-- Forcing every drivers to be built-in..."
            sed -i '/^CONFIG_/s/=m$/=y/' $FINAL_DEFCONFIG
            find techpack/ \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/\bobj-m\b/obj-y/g' {} +
            find techpack/audio -name "Makefile" -exec sed -i 's/\bobj-m\b/obj-y/g' {} +
            find techpack/audio techpack/camera -name "*.conf" -exec sed -i 's/^\([[:space:]]*export[[:space:]]\+CONFIG_[^=]*\)=m$/\1=y/' {} +

            echo "-- Fixing qcacld-3.0..."
            sed -i 's/static int[[:space:]]\+wlan_hdd_state_ctrl_param_create/static int __maybe_unused wlan_hdd_state_ctrl_param_create/' drivers/staging/qcacld-3.0/core/hdd/src/wlan_hdd_main.c
            find drivers/staging/qca-wifi-host-cmn drivers/staging/qcacld-3.0 -type f \( -name "*.c" -o -name "*.h" \) \
              -exec sed -i 's/\bnl80211hdr_put\b/qca_nl80211hdr_put/g' {} +
            sed -i 's/bool ipa_is_ready(/bool __weak ipa_is_ready(/g' drivers/staging/qcacld-3.0/components/ipa/dispatcher/src/wlan_ipa_obj_mgmt_api.c

            echo "-- Tuning default configs..."
            echo "CONFIG_LTO_CLANG=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_THINLTO=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_CRYPT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_DEFAULT_KEY=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_SNAPSHOT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_UEVENT=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_VERITY=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_VERITY_FEC=y" >> $FINAL_DEFCONFIG
            echo "CONFIG_DM_BOW=y" >> $FINAL_DEFCONFIG

            echo "-- Tuning compiler flags..."
            sed -i 's/-Wno-format-security/-Wno-format-security -Wno-declaration-after-statement -Wno-implicit-int -Wno-enum-conversion -Wno-default-const-init-var-unsafe -Wno-default-const-init-field-unsafe -Wno-misleading-indentation -Wno-unsequenced -Wno-sizeof-pointer-memaccess -Wno-implicit-function-declaration -Wno-implicit-enum-enum-cast/g' Makefile
            sed -i '/export KBUILD_CFLAGS/i KBUILD_CFLAGS += -mllvm -polly -mllvm -enable-gvn-hoist -Wno-unused-command-line-argument' Makefile
            cd ..

      - name: Apply goodies
        id: goodies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            echo "-- Exporting goodies settings..."
            export KERNELSU_SELECTOR="${{ matrix.root }}"
            export BBG_SELECTOR="bbg"
            export NOMOUNT_SELECTOR="nomount"
            export DROIDSPACES_SELECTOR="none"

            echo "-- Running goodies script..."
            cp goodies.sh "$KERNEL_DIR/"
            cp -r scripts/* "$KERNEL_DIR/scripts/"
            cd "$KERNEL_DIR"
            chmod +x goodies.sh
            bash goodies.sh
            cd ..

      - name: Compile the kernel
        run: |
            echo "-- Prepping build environment..."
            cd "$KERNEL_DIR"

            OUT_DIR="$PWD/out"
            mkdir -p $OUT_DIR &> /dev/null

            echo "-- Parsing final defconfig..."
            make O=$OUT_DIR $MAKE_ARGS $COMPILE_DEFCONFIG &> /dev/null

            echo "-- Executing olddefconfig and syncconfig..."
            { yes "" 2>/dev/null || true; } | make O=$OUT_DIR $MAKE_ARGS olddefconfig &> /dev/null
            { yes "" 2>/dev/null || true; } | make O=$OUT_DIR $MAKE_ARGS syncconfig &> /dev/null

            echo "-- Compiling the kernel..."
            make -j$(nproc --all) O=$OUT_DIR $MAKE_ARGS 2>&1 | tee build.log

            echo "-- Exporting build versions..."
            export KSU_NAME=$(grep -m 1 -e "-- BakaSU version name:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export KSU_CODE=$(grep -m 1 -e "-- BakaSU version code:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export SUSFS_VER=$(grep -m 1 -e "-- SUSFS_VERSION:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export BBG_VER=$(grep -m 1 -e "-- BBG version:" build.log | awk -F': ' '{print $2}' | tr -d '[:space:]')
            export NOMOUNT_VER=$(grep -m 1 "NOMOUNT_BASE_VERSION" fs/nomount/nomount.h 2>/dev/null | awk -F'"' '{print $2}' | tr -d '[:space:]')
            cp build.log ../build.log

            echo "-- Generating DTB & DTBO..."
            cd out/
            # find arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > arch/arm64/boot/dtb.img
            curl -sSL "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" | base64 -d > mkdtboimg.py
            chmod +x mkdtboimg.py
            if [[ ${{ matrix.devices }} == "a52" ]]; then
              python mkdtboimg.py create arch/arm64/boot/dtbo.img arch/arm64/boot/dts/samsung/${{ matrix.devices }}/${{ matrix.devices }}sxq/*.dtbo
            else
              python mkdtboimg.py create arch/arm64/boot/dtbo.img arch/arm64/boot/dts/samsung/${{ matrix.devices }}/${{ matrix.devices }}xq/*.dtbo
            fi
            cd ../

            # echo "-- Stripping Kernel modules..."
            # mkdir -p modules &> /dev/null
            # find out/ -type f -name "*.ko" -exec cp {} modules/ \;
            # llvm-strip --strip-debug modules/*.ko
            # ls -alhZ modules/
            # cd ..

            echo "-- Rebuilding boot image..."
            cd ../
            BOOT_SRC="$PWD/$KERNEL_DIR/clang/bin/images/boot.img"
            TMP_DIR="$PWD/$KERNEL_DIR/out/arch/arm64/boot/tmp"
            MAGISKBOOT="$PWD/$KERNEL_DIR/clang/bin/magiskboot"
            IMAGE_FILE="$PWD/$KERNEL_DIR/out/arch/arm64/boot/Image"
            if [[ ! -f "$BOOT_SRC" ]]; then
                echo "ERROR: Source image not found at $BOOT_SRC"
                exit 1
            fi
            mkdir -p "$TMP_DIR"
            cp "$BOOT_SRC" "$TMP_DIR/boot.img"
            (
                cd "$TMP_DIR"
                avbtool erase_footer --image "boot.img"
                "$MAGISKBOOT" unpack boot.img
                rm -f kernel
                cp $IMAGE_FILE kernel
                "$MAGISKBOOT" repack boot.img boot-repacked.img
                cp boot-repacked.img "../boot.img"
            )

            echo "-- Writing release info.txt..."
            echo "KSU_NAME=${KSU_NAME:-N/A}" >> release_info.txt
            echo "KSU_CODE=${KSU_CODE:-N/A}" >> release_info.txt
            echo "SUSFS_VER=${SUSFS_VER:-N/A}" >> release_info.txt
            echo "BBG_VER=${BBG_VER:-N/A}" >> release_info.txt
            echo "NOMOUNT_VER=${NOMOUNT_VER:-N/A}" >> release_info.txt

      - name: Preparing to zip up
        run: |
            echo "-- Exporting AnyKernel3 settings..."
            export IMAGE="boot.img"
            export DTBO="dtbo.img"

            echo "-- Copying kernel image and dtb/dtbo to output..."
            mkdir -p output
            mkdir -p output/images
            cp "$KERNEL_DIR/out/arch/arm64/boot/$IMAGE" output/images
            if [ -n "$DTBO" ] && [ -f "$KERNEL_DIR/out/arch/arm64/boot/$DTBO" ]; then cp "$KERNEL_DIR/out/arch/arm64/boot/$DTBO" output/images; fi

            echo "-- Touching update-binary and updater-script..."
            mkdir -p output/META-INF/com/google/android
            touch "output/META-INF/com/google/android/updater-script"
            touch "output/META-INF/com/google/android/update-binary"
            echo "# Dummy file; update-binary is a shell script." > "output/META-INF/com/google/android/updater-script"
            chmod +x update-binary-sm7325.sh
            bash update-binary-sm7325.sh

      - name: Pack kernel with AnyKernel3
        run: |
            echo "-- Exporting zip settings..."
            if [[ "${{ matrix.root }}" == "baka-susfs" ]]; then
              export KSUTYPE="root"
            elif [[ "${{ matrix.root }}" == "none" ]]; then
              export KSUTYPE="none"
            fi
            if [[ ${{ matrix.devices }} == "a52" ]]; then
              export ZIP_PREFIX="neon-lineage-${{ matrix.devices }}sxq-sm7325"
            else
              export ZIP_PREFIX="neon-lineage-${{ matrix.devices }}xq-sm7325"
            fi
            export ZIPNAME="${ZIP_PREFIX}-${KSUTYPE}-${{ inputs.build_date }}.zip"

            cd output
            zip -rq9 "../$ZIPNAME" ./*
            cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lineage-${{ matrix.root }}-${{ matrix.devices }}
          path: |
            *.zip
            release_info.txt
            build.log